# ─────────────────────────────────────────────────────────────
# PROD override — prebuilt images, persistent volume, resource limits.
# Postgres is NOT published externally (internal network only); expose
# the DB only through a managed service or an explicit, secured tunnel.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.prod.yml \
#     --env-file infra/env/prod.env.example up -d
#
# In real prod prefer pulling tagged images (set API_IMAGE/WEB_IMAGE/TAG)
# instead of building on the host.
# ─────────────────────────────────────────────────────────────
name: powerlog-prod

services:
  postgres:
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    pull_policy: missing
    environment:
      NODE_ENV: production
      APP_ENV: prod
    ports:
      - "${API_PORT:-4000}:4000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    pull_policy: missing
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata_prod:
