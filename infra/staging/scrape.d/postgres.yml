# STAGING-only extra scrape: this stack's own Postgres exporter. Loaded via the
# shared prometheus.yml `scrape_config_files` glob. Staging is self-contained
# (its own Postgres, unlike prod's shared core DB), so it scrapes its exporter
# here — same as dev.
#
# NOTE: scrape_config_files files are NOT bare lists — Prometheus unmarshals each
# file into a mapping with a `scrape_configs` key (a bare `- job_name:` list
# crash-loops it with "cannot unmarshal !!seq into config.ScrapeConfigs").
scrape_configs:
  - job_name: powerlog-postgres
    static_configs:
      - targets: ["powerlog-postgres-exporter:9187"]
