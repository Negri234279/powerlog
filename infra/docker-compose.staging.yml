# ─────────────────────────────────────────────────────────────
# STAGING override — production-like images, isolated ports/volume.
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.staging.yml \
#     --env-file infra/env/staging.env.example up -d --build
# ─────────────────────────────────────────────────────────────
name: powerlog-staging

services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata_staging:/var/lib/postgresql/data

  api:
    build:
      target: production
    environment:
      NODE_ENV: production
      APP_ENV: staging
    ports:
      - "${API_PORT:-4001}:4000"

  web:
    build:
      target: production
    environment:
      NODE_ENV: production
    ports:
      - "${WEB_PORT:-3001}:3000"

volumes:
  pgdata_staging:
