# ─────────────────────────────────────────────────────────────
# DEV — ALL-IN-ONE, depends on nothing external. Hot-reload app (source
# bind-mounts, nest watch) + its own Postgres + the FULL observability stack
# (Prometheus · Loki · Tempo · Alloy · Alertmanager · Grafana) + Mailpit.
#
#   docker compose -f infra/dev/compose.yml --env-file infra/dev/.env up --build
#
# Service names are unified to `powerlog-*` so the obs configs in
# ../observability are byte-identical to staging/prod (edit dashboards/alerts
# once). Dev is self-contained on a single private network (no shared infra).
# ─────────────────────────────────────────────────────────────
name: powerlog-dev

services:
  # ── App ──────────────────────────────────────────────────────
  powerlog-postgres:
    image: postgres:16-alpine
    container_name: powerlog-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powerlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powerlog}
      POSTGRES_DB: ${POSTGRES_DB:-powerlog}
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-powerlog_exporter}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-powerlog_exporter}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerlog} -d ${POSTGRES_DB:-powerlog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ../docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: powerlog-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_USER:-powerlog_exporter}:${POSTGRES_EXPORTER_PASSWORD:-powerlog_exporter}@powerlog-postgres:5432/${POSTGRES_DB:-powerlog}?sslmode=disable"
    depends_on:
      powerlog-postgres:
        condition: service_healthy
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: powerlog-pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-demo@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-secret}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-api:
    image: powerlog/api:dev
    container_name: powerlog-api
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: development
    command: ["pnpm", "--filter", "@powerlog/api", "start:dev"]
    env_file:
      - path: ../../apps/api/.env
        required: false
    environment:
      NODE_ENV: development
      APP_ENV: dev
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-powerlog}:${POSTGRES_PASSWORD:-powerlog}@powerlog-postgres:5432/${POSTGRES_DB:-powerlog}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-powerlog}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-powerlog-web}
      COOKIE_SECURE: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: powerlog-mailpit
      SMTP_PORT: "1025"
      AVATAR_DIR: /app/apps/api/public/avatars
      AVATAR_PUBLIC_BASE_URL: http://localhost:4000/avatars
      # BYOK master key (AES-256-GCM). Throwaway dev default — it only ever
      # encrypts keys in the local database. Real envs inject their own.
      AI_ENCRYPTION_KEY: ${AI_ENCRYPTION_KEY:-Rcm3M6WDGav0aytwV+pkxy6UHSVsP4/z+HjgkNmSMeI=}
      OTEL_SERVICE_NAME: powerlog-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://powerlog-tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      # Win11 + WSL2: force polling so tsc's watcher fires across the bind mount.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    depends_on:
      powerlog-postgres:
        condition: service_healthy
      powerlog-mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${API_PORT:-4000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ../../apps/api:/app/apps/api
      - ../../packages:/app/packages
      - api_root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-web:
    image: powerlog/web:dev
    container_name: powerlog-web
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      target: development
    command: ["pnpm", "--filter", "@powerlog/web", "dev"]
    env_file:
      - path: ../../apps/web/.env
        required: false
    environment:
      NODE_ENV: development
      APP_ENV: dev
      # `next dev` re-evaluates next.config rewrites per request, so these are read
      # at RUNTIME (unlike the prod build, which bakes them in). Reach the API and
      # Alloy's faro.receiver by service DNS on powerlog-net.
      API_INTERNAL_URL: http://powerlog-api:4000
      FARO_INTERNAL_URL: http://powerlog-alloy:12347
      # Faro no-ops in dev unless this is set; the dev stack ships Loki/Alloy/Grafana,
      # so enable browser RUM here to populate the "Web RUM (Faro)" dashboard.
      NEXT_PUBLIC_FARO_DEV: "true"
      # Server-side traces (@vercel/otel in instrumentation.ts) → this stack's Tempo.
      OTEL_SERVICE_NAME: powerlog-web
      OTEL_EXPORTER_OTLP_ENDPOINT: http://powerlog-tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      # Win11 + WSL2: force watchpack polling so HMR fires across the bind mount.
      WATCHPACK_POLLING: "true"
    depends_on:
      powerlog-api:
        condition: service_healthy
      powerlog-alloy:
        condition: service_started
    ports:
      - "${WEB_PORT:-4115}:4115"
    volumes:
      - ../../apps/web:/app/apps/web
      - ../../packages:/app/packages
      - web_root_node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      # Turbopack's persistent cache uses file locking (flock), which FAILS with
      # "os error 5 (EIO)" over the Windows bind mount. Keep .next on a named
      # volume (ext4 in the VM) so the lockfile lives on a lock-capable FS.
      - web_next:/app/apps/web/.next
    networks: [powerlog-net]
    restart: unless-stopped

  # One-shot Drizzle migration runner. Enable with: --profile tools
  powerlog-migrate:
    image: powerlog/api:dev-migrate
    container_name: powerlog-migrate
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: migrate
    profiles: ["tools"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-powerlog}:${POSTGRES_PASSWORD:-powerlog}@powerlog-postgres:5432/${POSTGRES_DB:-powerlog}
    depends_on:
      powerlog-postgres:
        condition: service_healthy
    networks: [powerlog-net]
    restart: "no"

  # ── Mail (dev catch-all) ─────────────────────────────────────
  powerlog-mailpit:
    image: axllent/mailpit:latest
    container_name: powerlog-mailpit
    ports:
      - "${MAILPIT_SMTP_PORT:-12525}:1025"
      - "${MAILPIT_UI_PORT:-18025}:8025"
    networks: [powerlog-net]
    restart: unless-stopped

  # ── Observability (shared single-source configs in ../observability) ──
  powerlog-prometheus:
    image: prom/prometheus:latest
    container_name: powerlog-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - ./scrape.d:/etc/prometheus/scrape.d:ro
      - prometheus_dev:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-loki:
    image: grafana/loki:latest
    container_name: powerlog-loki
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_dev:/loki
    ports:
      - "${LOKI_PORT:-13100}:3100"
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-tempo:
    image: grafana/tempo:latest
    container_name: powerlog-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_dev:/var/tempo
    ports:
      - "${TEMPO_PORT:-13200}:3200"
      - "4317:4317"
      - "4318:4318"
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-alloy:
    image: grafana/alloy:latest
    container_name: powerlog-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ../observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_dev:/var/lib/alloy/data
    ports:
      - "${ALLOY_PORT:-12345}:12345"
      # faro.receiver — the powerlog-web container proxies browser RUM here via the
      # Next /faro rewrite (FARO_INTERNAL_URL=http://powerlog-alloy:12347, by DNS).
      # Host port kept so the web app can also be run on the HOST (localhost:12347).
      - "${FARO_PORT:-12347}:12347"
    depends_on:
      - powerlog-loki
    networks: [powerlog-net]
    restart: unless-stopped

  # Alertmanager for parity with staging/prod (same shared config). In dev the
  # Discord webhook is optional — alerts are still visible in Prometheus/Grafana.
  powerlog-alertmanager-init:
    image: busybox:1.37
    container_name: powerlog-alertmanager-init
    command:
      - sh
      - -c
      - 'printf "%s" "$$POWERLOG_DISCORD_WEBHOOK_URL" > /secrets/discord_webhook_url && echo ok'
    environment:
      POWERLOG_DISCORD_WEBHOOK_URL: ${POWERLOG_DISCORD_WEBHOOK_URL:-}
    volumes:
      - alertmanager_dev:/secrets
    restart: "no"

  powerlog-alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: powerlog-alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ../observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_dev:/etc/alertmanager/secrets:ro
    depends_on:
      powerlog-alertmanager-init:
        condition: service_completed_successfully
    networks: [powerlog-net]
    restart: unless-stopped

  powerlog-grafana:
    image: grafana/grafana:latest
    container_name: powerlog-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dev:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    depends_on:
      - powerlog-prometheus
      - powerlog-loki
      - powerlog-tempo
    networks: [powerlog-net]
    restart: unless-stopped

volumes:
  pgdata_dev:
  api_root_node_modules:
  api_node_modules:
  web_root_node_modules:
  web_node_modules:
  web_next:
  prometheus_dev:
  loki_dev:
  tempo_dev:
  alloy_dev:
  alertmanager_dev:
  grafana_dev:

networks:
  powerlog-net:
    name: powerlog-dev-net
