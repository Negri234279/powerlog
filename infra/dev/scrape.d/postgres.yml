# DEV-only extra scrape: the local Postgres exporter. Loaded via the shared
# prometheus.yml `scrape_config_files` glob. staging/prod don't have this (their
# Postgres is the shared core DB, scraped by pi-infra's exporter).
#
# NOTE: scrape_config_files files are NOT bare lists — Prometheus unmarshals
# each file into a mapping with a `scrape_configs` key (a bare `- job_name:`
# list crash-loops it with "cannot unmarshal !!seq into config.ScrapeConfigs").
scrape_configs:
  - job_name: powerlog-postgres
    static_configs:
      - targets: ["powerlog-postgres-exporter:9187"]
