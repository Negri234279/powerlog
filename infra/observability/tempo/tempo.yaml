# Single-binary Tempo for local dev (filesystem storage).
# ingester/compactor use defaults (tuning them is unnecessary for dev).
server:
  http_listen_port: 3200
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317

# Derive RED span-metrics + a service graph from incoming spans and push them to
# Prometheus via remote-write. Prometheus must run with
# --web.enable-remote-write-receiver (set in docker-compose.dev.yml).
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Single-tenant dev: turn the generator processors on by default.
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
