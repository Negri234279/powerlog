apiVersion: 1

providers:
  - name: powerlog
    type: file
    # All provisioned dashboards land in the "PowerLog" folder (same folder the
    # alerting provisioning uses, so dashboards and alerts sit together).
    folder: PowerLog
    disableDeletion: false
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
