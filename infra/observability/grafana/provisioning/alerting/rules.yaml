# Grafana-managed alert rules (unified alerting), provisioned on startup.
# Dev has no configured contact point, so these surface state in the Alerting
# UI rather than notifying. Each rule: A = PromQL query, B = reduce(last),
# C = threshold; `condition` points at C.
apiVersion: 1

groups:
  - orgId: 1
    name: powerlog-health
    folder: PowerLog
    interval: 1m
    rules:
      # ── API target down ──────────────────────────────────────
      - uid: powerlog-api-down
        title: API target down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: powerlog-api is not being scraped (up == 0)
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: up{job="powerlog-api"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Postgres down ────────────────────────────────────────
      - uid: powerlog-postgres-down
        title: Postgres down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: postgres-exporter reports pg_up == 0
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: pg_up
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Refresh-token reuse detected (security) ──────────────
      - uid: powerlog-refresh-reuse
        title: Refresh-token reuse detected
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: A revoked refresh token was replayed — its family was revoked (possible theft)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(powerlog_auth_refresh_total{status="reuse_detected"}[10m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

  - orgId: 1
    name: powerlog-slo
    folder: PowerLog
    interval: 1m
    rules:
      # ── High error ratio (>10% of requests over 5m) ──────────
      - uid: powerlog-high-error-ratio
        title: High request error ratio
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: ">10% of inbound requests are erroring (5m)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(rate(domain_errors_total[5m])) / sum(rate(http_request_duration_seconds_count[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.1] }
              refId: C

      # ── Event loop saturated (p99 lag > 200ms) ───────────────
      - uid: powerlog-eventloop-lag
        title: Event loop lag p99 high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Node.js event loop p99 lag > 200ms (process saturated)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: nodejs_eventloop_lag_p99_seconds
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.2] }
              refId: C

      # ── Transactional email failures (any in 10m) ────────────
      - uid: powerlog-email-failures
        title: Transactional email failures
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "One or more transactional emails failed to send (10m)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(powerlog_emails_sent_total{status="error"}[10m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # ── Connection pool saturated (clients waiting) ──────────
      - uid: powerlog-pg-pool-saturated
        title: pg connection pool saturated
        condition: C
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Clients are waiting for a pg connection (pool at max)
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: max(powerlog_pg_pool_connections{state="waiting"})
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
