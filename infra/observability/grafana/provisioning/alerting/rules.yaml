# Grafana-managed alert rules (unified alerting), provisioned on startup.
# Dev has no configured contact point, so these surface state in the Alerting
# UI rather than notifying. Each rule: A = PromQL query, B = reduce(last),
# C = threshold; `condition` points at C.
apiVersion: 1

groups:
  - orgId: 1
    name: powerlog-health
    folder: PowerLog
    interval: 1m
    rules:
      # ── API target down ──────────────────────────────────────
      - uid: powerlog-api-down
        title: API target down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: powerlog-api is not being scraped (up == 0)
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: up{job="powerlog-api"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Postgres down ────────────────────────────────────────
      - uid: powerlog-postgres-down
        title: Postgres down
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: postgres-exporter reports pg_up == 0
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: pg_up
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Refresh-token reuse detected (security) ──────────────
      - uid: powerlog-refresh-reuse
        title: Refresh-token reuse detected
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: A revoked refresh token was replayed — its family was revoked (possible theft)
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(powerlog_auth_refresh_total{status="reuse_detected"}[10m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # ── R2 bucket unreachable (app-side HeadObject probe) ─────
      - uid: powerlog-r2-down
        title: R2 bucket unreachable
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: R2 HeadObject probe failing (powerlog_r2_up == 0) — avatar storage unreachable
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: min(powerlog_r2_up)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

  - orgId: 1
    name: powerlog-slo
    folder: PowerLog
    interval: 1m
    rules:
      # ── High error ratio (>10% of requests over 5m) ──────────
      - uid: powerlog-high-error-ratio
        title: High request error ratio
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: ">10% of inbound requests are erroring (5m)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(rate(domain_errors_total[5m])) / sum(rate(http_request_duration_seconds_count[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.1] }
              refId: C

      # ── Event loop saturated (p99 lag > 200ms) ───────────────
      - uid: powerlog-eventloop-lag
        title: Event loop lag p99 high
        condition: C
        for: 5m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "Node.js event loop p99 lag > 200ms (process saturated)"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: nodejs_eventloop_lag_p99_seconds
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.2] }
              refId: C

      # ── Transactional email failures (any in 10m) ────────────
      - uid: powerlog-email-failures
        title: Transactional email failures
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: "One or more transactional emails failed to send (10m)"
          # Renders "View panel"/"View dashboard" links in the notification,
          # pointing at the Email log panel (sends + delivery events) so you can
          # jump from the alert straight to the failure cause (e.g. a 403).
          __dashboardUid__: powerlog-overview
          __panelId__: "138"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(powerlog_emails_sent_total{status="failed"}[10m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # ── Connection pool saturated (clients waiting) ──────────
      - uid: powerlog-pg-pool-saturated
        title: pg connection pool saturated
        condition: C
        for: 2m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Clients are waiting for a pg connection (pool at max)
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: max(powerlog_pg_pool_connections{state="waiting"})
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

  - orgId: 1
    name: powerlog-email
    folder: PowerLog
    interval: 1m
    rules:
      # ── Sending domain not verified (Resend) ─────────────────
      # noDataState OK so dev/SMTP (no series) never fires.
      - uid: powerlog-resend-domain-unverified
        title: Resend sending domain not verified
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: A Resend sending domain is not verified — emails will fail to send
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: min(powerlog_resend_domain_verified)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Resend API unreachable (API key probe) ───────────────
      - uid: powerlog-resend-api-down
        title: Resend API unreachable
        condition: C
        for: 10m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: Resend API probe failing (powerlog_resend_api_up == 0) — key invalid or Resend down
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: powerlog_resend_api_up
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Spam complaints (any in the last hour) ───────────────
      - uid: powerlog-email-complaints
        title: Email spam complaints
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: critical
        annotations:
          summary: Recipients marked email as spam (Resend complained event) — reputation risk
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(powerlog_email_events_total{event="complained"}[1h]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C

      # ── High bounce ratio (>5% of delivered+bounced over 1h) ─
      - uid: powerlog-email-bounce-rate
        title: High email bounce rate
        condition: C
        for: 0m
        noDataState: OK
        execErrState: OK
        labels:
          severity: warning
        annotations:
          summary: ">5% of recent emails bounced (1h) — check recipients / domain reputation"
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              datasource: { type: prometheus, uid: prometheus }
              expr: sum(increase(powerlog_email_events_total{event="bounced"}[1h])) / clamp_min(sum(increase(powerlog_email_events_total{event=~"delivered|bounced"}[1h])), 1)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [0.05] }
              refId: C
