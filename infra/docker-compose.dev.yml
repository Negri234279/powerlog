# ─────────────────────────────────────────────────────────────
# DEV override — containerized hot-reload with source bind-mounts,
# plus the full observability stack (always on in dev):
#   Prometheus (metrics) · Loki (logs) · Tempo (traces) ·
#   Grafana (UI) · Alloy (ships container stdout → Loki).
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml \
#     --env-file infra/env/dev.env.example up --build
#
# Tip: for the fastest loop you can instead run only postgres (+ the
# observability services) here and run the apps on the host with `pnpm dev`.
# ─────────────────────────────────────────────────────────────
name: powerlog-dev

services:
  postgres:
    environment:
      # Consumed by the initdb script that provisions the exporter's role.
      POSTGRES_EXPORTER_USER: ${POSTGRES_EXPORTER_USER:-powerlog_exporter}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:-powerlog_exporter}
    ports:
      # Host 15432: 5432/5433 fall inside a Windows (Hyper-V/WinNAT) reserved
      # port range and can't be bound. Container port stays 5432.
      - 15432:5432
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      # Runs on first cluster init only — creates the pg_monitor role.
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro

  pgadmin:
    image: dpage/pgadmin4:9.8
    ports:
      - 5050:80
    environment:
      PGADMIN_DEFAULT_EMAIL: demo@example.com
      PGADMIN_DEFAULT_PASSWORD: secret
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

  api:
    image: powerlog/imapi:dev
    build:
      dockerfile: infra/docker/Dockerfile.api
      target: development
    command: [ "pnpm", "--filter", "@powerlog/api", "start:dev" ]
    env_file:
      - ../apps/api/.env
    environment:
      NODE_ENV: development
      APP_ENV: dev
      # Dev is plain HTTP — don't mark cookies Secure or they won't be set.
      COOKIE_SECURE: "false"
      # Transactional email → Mailpit (catch-all SMTP; UI at http://localhost:18025).
      # Avatars: local filesystem in dev, served by the API at /avatars.
      #AVATAR_STORAGE: filesystem
      AVATAR_DIR: /app/apps/api/public/avatars
      AVATAR_PUBLIC_BASE_URL: http://localhost:4000/avatars
      # OpenTelemetry → Tempo (OTLP/HTTP). Read by src/tracing.ts.
      OTEL_SERVICE_NAME: powerlog-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Win11 + WSL2: inotify events don't cross the host→container bind mount, so
      # tsc's native FS watcher never fires. Force polling (file + directory, the
      # latter so new files are picked up). Container-only — the host's `pnpm dev`
      # keeps efficient native events.
      TSC_WATCHFILE: DynamicPriorityPolling
      TSC_WATCHDIRECTORY: DynamicPriorityPolling
    # Merges with the base (postgres: service_healthy). Mailpit must be up before
    # the API tries to send mail; readiness isn't needed (email is best-effort).
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ../apps/api:/app/apps/api
      - ../packages:/app/packages
      - api_root_node_modules:/app/node_modules
      - api_node_modules:/app/apps/api/node_modules

  #web:
  #  build:
  #    target: development
  #  command: ["pnpm", "--filter", "@powerlog/web", "dev"]
  #  environment:
  #    NODE_ENV: development
  #    WATCHPACK_POLLING: "true"
  #    # Browser → same-origin BFF proxy; Next forwards to the api container, so
  #    # the API's HTTPOnly auth cookies stay first-party (middleware can read them).
  #    NEXT_PUBLIC_GRAPHQL_URL: /api/graphql
  #    API_INTERNAL_URL: http://api:4000
  #    # OpenTelemetry → Tempo (server traces). Read by instrumentation.ts.
  #    OTEL_SERVICE_NAME: powerlog-web
  #    OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
  #    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  #    OTEL_RESOURCE_ATTRIBUTES: deployment.environment.name=dev
  #  ports:
  #    - "${WEB_PORT:-3000}:3000"
  #  volumes:
  #    - ../apps/web:/app/apps/web
  #    - ../packages:/app/packages
  #    - web_root_node_modules:/app/node_modules
  #    - web_node_modules:/app/apps/web/node_modules

  # ── Mail (dev catch-all) ─────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Host ports moved into the 1xxxx range: on Win11 a built-in RPC service
      # squats IPv4 0.0.0.0:1025, and WinNAT reserves 2525/8025 too. Container
      # ports stay 1025/8025 (services inside the network use mailpit:1025).
      # Host-run API → localhost:12525; Mailpit UI → http://localhost:18025.
      - "12525:1025" # SMTP (host 12525)
      - "18025:8025" # Web UI (host 18025)
    restart: unless-stopped

  # ── Observability ────────────────────────────────────────────
  # Postgres internal stats (pg_stat_*) → Prometheus. Scraped in-network as
  # postgres-exporter:9187 (no host port needed). Uses the least-privilege
  # pg_monitor role created by the postgres initdb script.
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_EXPORTER_USER:-powerlog_exporter}:${POSTGRES_EXPORTER_PASSWORD:-powerlog_exporter}@postgres:5432/${POSTGRES_DB:-powerlog}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Cloudflare R2 account analytics → Prometheus. Queries Cloudflare's GraphQL
  # Analytics API (account-level), so it reports real R2 usage regardless of
  # which env this stack runs in. Opt-in: only starts with `--profile cloudflare`.
  # Reached in-network as cloudflare-exporter:8080.
  #
  # REQUIRED in .dev.env (exact var names — the exporter ignores other names):
  #   CF_API_TOKEN=...     token with "Account Analytics: Read"
  #   CF_ACCOUNTS=<id>     account id (NOT CF_ACCOUNT_ID). R2 is account-scoped;
  #                        without CF_ACCOUNTS the exporter never fetches R2 and
  #                        the cloudflare_r2_* metrics stay empty.
  cloudflare-exporter:
    image: ghcr.io/lablabs/cloudflare_exporter:latest
    profiles: [ "cloudflare" ]
    env_file: ".dev.env"
    environment:
      LISTEN: ":8080"
      # Cloudflare analytics update on a ~5 min cadence; don't hammer the API.
      SCRAPE_DELAY: "300"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-otlp-receiver
      # Receive Tempo's metrics_generator remote-write (span-metrics + service graph).
      - --web.enable-remote-write-receiver
      # Store trace exemplars (Tempo sends them; lets panels link to traces).
      - --enable-feature=exemplar-storage
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_dev:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_dev:/loki
    ports:
      # Host 13100: the 3000–3200 range is unbindable on Win11 (WinNAT reserved).
      # Container port stays 3100 (Alloy/Grafana reach it via loki:3100 internally).
      - "13100:3100"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo/tempo.yaml" ]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_dev:/var/tempo
    ports:
      # Host 13200 (3200 is in the Win11 reserved range); container stays 3200,
      # reached internally as tempo:3200 / tempo:4318. OTLP ports are outside the
      # reserved range so they keep their numbers for host-run apps (localhost:4318).
      - "13200:3200" # tempo query/api
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    restart: unless-stopped

  alloy:
    image: grafana/alloy:latest
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_dev:/var/lib/alloy/data
    ports:
      - "12345:12345" # Alloy UI
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    env_file:
      - .dev.env
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_FEATURE_TOGGLES_ENABLE: traceqlEditor

    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_dev:/var/lib/grafana
    ports:
      # Host 13000 → container 3000. The 3000–3200 range (incl. 3001) is the
      # web app / Win11 WinNAT-reserved; open the UI at http://localhost:13000.
      - "13000:3000" # Grafana UI
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  pgdata_dev:
  api_root_node_modules:
  api_node_modules:
  web_root_node_modules:
  web_node_modules:
  prometheus_dev:
  loki_dev:
  tempo_dev:
  alloy_dev:
  grafana_dev:
