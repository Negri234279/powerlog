# ─────────────────────────────────────────────────────────────
# powerlog — BASE compose. Not meant to run alone; always combine
# with one environment override:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up
#
# Defines services, env wiring, healthchecks and dependencies.
# Storage (volumes/tmpfs) and published ports are set per environment.
# ─────────────────────────────────────────────────────────────
name: powerlog

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-powerlog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-powerlog}
      POSTGRES_DB: ${POSTGRES_DB:-powerlog}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-powerlog} -d ${POSTGRES_DB:-powerlog}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  api:
    image: ${API_IMAGE:-powerlog/api}:${TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      APP_ENV: ${APP_ENV:-prod}
      API_PORT: ${API_PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-powerlog}:${POSTGRES_PASSWORD:-powerlog}@postgres:5432/${POSTGRES_DB:-powerlog}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_ISSUER: ${JWT_ISSUER:-powerlog}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-powerlog-web}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      REFRESH_EXPIRES_IN: ${REFRESH_EXPIRES_IN:-30d}
      # Auth cookies (secure=true behind HTTPS; the dev override sets it false).
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-pl_at}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-pl_rt}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Google OAuth (blank disables Google login).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:4000/auth/google/callback}
      # OpenTelemetry (set the endpoint to a collector; dev override → tempo).
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-powerlog-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:${API_PORT:-4000}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Generous grace window: the entrypoint applies pending migrations before
      # the server starts listening, so don't mark unhealthy during that time.
      start_period: 60s
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE:-powerlog/web}:${TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.web
      target: production
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_GRAPHQL_URL: ${NEXT_PUBLIC_GRAPHQL_URL:-http://localhost:4000/graphql}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-shot Drizzle migration runner. Enable with: --profile tools
  migrate:
    image: ${API_IMAGE:-powerlog/api}:${TAG:-latest}
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.api
      target: migrate
    profiles: ["tools"]
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-powerlog}:${POSTGRES_PASSWORD:-powerlog}@postgres:5432/${POSTGRES_DB:-powerlog}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
