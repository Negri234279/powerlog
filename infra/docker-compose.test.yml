# ─────────────────────────────────────────────────────────────
# TEST override — ephemeral Postgres (tmpfs, no persistence).
#
# NOTE: unit + integration tests use Testcontainers, which spin up their
# own throwaway Postgres per run — they do NOT need this file. Use this
# compose only for a SHARED test DB or end-to-end runs:
#
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.test.yml \
#     --env-file infra/env/test.env.example up -d postgres
#
# Optional e2e api/web (production images) live under the `e2e` profile.
# ─────────────────────────────────────────────────────────────
name: powerlog-test

services:
  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-powerlog_test}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"

  api:
    profiles: ["e2e"]
    build:
      target: production
    environment:
      NODE_ENV: test
      APP_ENV: test
    ports:
      - "${API_PORT:-4002}:4000"

  web:
    profiles: ["e2e"]
    build:
      target: production
    environment:
      NODE_ENV: test
    ports:
      - "${WEB_PORT:-3002}:3000"
