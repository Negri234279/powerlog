  Public: preview a pending invitation by its opaque token (for the invite-aware signup page).
  """
  coachInvitationPreview(token: String!): CoachInvitationPreview

  """Whether an email is free to register."""
  emailAvailable(email: String!): Boolean!

  """
  The caller's recent completed sessions logging one exercise, with their performed sets.
  """
  exerciseSessionHistory(excludeSessionId: ID, exerciseId: ID!, limit: Int): [ExerciseSessionHistory!]!

  """
  The caller's per-exercise volume and PRs, optionally within a date range.
  """
  exerciseStats(from: String, to: String): [ExerciseStats!]!

  """The exercise catalog, optionally filtered by category."""
  exercises(category: String): [Exercise!]!

  """The currently authenticated user."""
  me: Me!

  """One of the caller’s mesocycles, with its full tree."""
  mesocycle(id: ID!): Mesocycle!

  """
  The training block awaiting a decision, if any. One per trainee: omit athleteId for your own, pass it for the one you are designing for that athlete.
  """
  mesocycleDraft(athleteId: ID): AiMesocycleDraft

  """
  One mesocycle draft by id, whatever its status — the history’s detail view. Null when it is not a mesocycle draft, does not exist, or is not yours.
  """
  mesocycleDraftById(draftId: ID!): AiMesocycleDraft

  """
  The caller's mesocycles (newest first), with cheap rollups; optional name search.
  """
  mesocycles(search: String): [MesocycleSummary!]!

  """Providers the authenticated user has configured."""
  myAiSettings: [AiProviderConfig!]!

  """
  The caller's AI spend per model plus totals, estimated from a static price table.
  """
  myAiUsage: AiUsageSummary!

  """
  One athlete linked to the calling coach (coaches only). Null when they are not your athlete — so a stale link renders as not-found instead of loading the whole roster to look them up.
  """
  myAthlete(athleteId: ID!): CoachUser

  """
  Training rollups for every athlete the calling coach coaches, in one grouped pass. Identity is not included — merge with `myAthletes` by athleteId (coaches only).
  """
  myAthleteRoster(from: String, to: String): [CoachRosterEntry!]!

  """Athletes linked to the caller."""
  myAthletes: [CoachUser!]!

  """Coaches linked to the caller."""
  myCoaches: [CoachUser!]!

  """
  What your plan includes. For the UI only — the server is the authority on every gate.
  """
  myEntitlements: MyEntitlements!

  """Your billing history, as the gateway issued it."""
  myInvoices(limit: Int, offset: Int): MyInvoicePage!

  """The caller's notification inbox, newest first (keyset-paginated)."""
  myNotifications(cursor: String, limit: Int): NotificationsPage!

  """The authenticated user's profile."""
  myProfile: Profile!

  """The user’s active sessions (devices)."""
  mySessions: [Session!]!

  """
  Your subscription in an audience (athlete | coach), or null when you are on that free plan.
  """
  mySubscription(audience: String!): MySubscription

  """
  The caller's self-created counts (templates, mesocycles, workouts), for the plan usage readout.
  """
  myWorkoutUsage: WorkoutUsage!

  """Pending invitations received by the caller."""
  pendingInvitations: [PendingInvitation!]!

  """Liveness ping for the GraphQL schema."""
  ping: String!

  """
  One session draft by id, whatever its status — the history’s detail view. Null when it is not a session draft, does not exist, or is not yours.
  """
  planDraftById(draftId: ID!): AiPlanDraft

  """The proposal awaiting a decision on this session, if any."""
  sessionPlanDraft(sessionId: ID!): AiPlanDraft

  """
  e1RM progression and projection for one exercise, optionally within a date range.
  """
  strengthProgression(exerciseId: ID!, from: String, to: String): StrengthProgression!

  """
  The caller's volume distribution (muscle/category) and RPE breakdown, optionally ranged.
  """
  trainingDistribution(from: String, to: String): TrainingDistribution!

  """
  How the caller is executing their training: adherence to their own planned sessions, set outcomes, load compliance and period-over-period trends.
  """
  trainingExecution(from: String, to: String): TrainingExecution!

  """The caller's adherence and programmed-vs-executed load, week by week."""
  trainingExecutionSeries(from: String, to: String): [ExecutionBucket!]!

  """
  The caller's headline training KPIs (incl. estimated S+B+D total), optionally ranged.
  """
  trainingSummary(from: String, to: String): TrainingSummary!

  """
  Whether you can still get a free trial in an audience (athlete | coach). False once you have used your one trial there.
  """
  trialEligible(audience: String!): Boolean!

  """Number of unread notifications (the bell badge)."""
  unreadNotificationsCount: Int!

  """Whether a public handle is free to register."""
  usernameAvailable(username: String!): Boolean!

  """The caller's weekly training volume, optionally within a date range."""
  volumeSeries(from: String, to: String): [VolumeBucket!]!

  """
  The caller's session history, newest first (keyset-paginated; optional status/date/exercise/notes filters).
  """
  workoutHistory(cursor: String, exerciseId: ID, from: String, limit: Int, query: String, status: String, to: String): WorkoutHistoryPage!

  """A workout session owned by the caller, with its full tree."""
  workoutSession(id: ID!): WorkoutSession!

  """One of the caller’s templates, with its full tree."""
  workoutTemplate(id: ID!): WorkoutTemplate!

  """
  The caller's templates (name-ordered), with cheap rollups; optional name search.
  """
  workoutTemplates(scope: String, search: String): [WorkoutTemplateSummary!]!
}

