name: Sync infra → pi-infra

# When powerlog's infra changes land on main, mirror the relevant files into the
# central pi-infra repo (apps/powerlog + the shared-Grafana glue) and open a PR
# there. The pi-infra deploy poller picks the change up once the PR is merged.
#
# Requires a repo secret PI_INFRA_SYNC_TOKEN: a PAT (or GitHub App token) with
# `contents:write` + `pull-requests:write` on the pi-infra repo. Optionally set
# a repo variable PI_INFRA_REPO (defaults to Negri234279/pi-infra).

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - "scripts/sync-pi-infra.sh"
      - ".github/workflows/sync-pi-infra.yml"
  workflow_dispatch: {}

concurrency:
  group: sync-pi-infra
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout powerlog (source)
        uses: actions/checkout@v4
        with:
          path: powerlog

      - name: Checkout pi-infra (target)
        uses: actions/checkout@v4
        with:
          repository: Negri234279/pi-infra
          token: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
          path: pi-infra

      - name: Apply sync contract
        run: bash powerlog/scripts/sync-pi-infra.sh "${{ github.workspace }}/pi-infra"

      - name: Open PR in pi-infra
        uses: peter-evans/create-pull-request@v8
        with:
          path: pi-infra
          token: ${{ secrets.PI_INFRA_SYNC_TOKEN }}
          branch: sync/powerlog-infra
          delete-branch: true
          sign-commits: true
          commit-message: "chore(sync): powerlog infra @ ${{ github.sha }}"
          title: "chore(sync): powerlog infra"
          body: |
            Automated sync of powerlog's `infra/` into this repo.

            **Source:** `${{ github.repository }}@${{ github.sha }}`

            Mirrors (per the sync contract):
            - `infra/prod/` → `apps/powerlog/prod/`
            - `infra/observability/` (minus grafana) → `apps/powerlog/observability/`
            - app dashboards → `core/grafana/dashboards/powerlog/`
            - datasources → `core/grafana/provisioning/datasources/powerlog.yml`

            🤖 Generated by the `sync-pi-infra` workflow.
          labels: |
            automated
            infra-sync
